<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>demo-recording</title>
    <link rel="stylesheet" href="/style.css" />
    <script>
      // Apply the saved theme before first paint (default: Catppuccin Macchiato).
      document.documentElement.dataset.theme = localStorage.getItem("demo-rec-theme") === "latte" ? "latte" : "macchiato";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
