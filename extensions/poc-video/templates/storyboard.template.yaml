# storyboard.yaml — poc-video storyboard (v0.1 schema)
# Drafted by the agent after pass-1 exploration; approved at checkpoint 1.
# Recording is a dumb deterministic replay of this file.
# Schema: references/storyboard-schema.md · validate: scripts/validate-storyboard.mjs

meta:
  target: acme-console            # short target name
  title: "Acme Console — from setup to first insight"
  one_liner: "One dashboard, three minutes, zero setup"   # title-card subtitle
  language: en
  voice:
    name: "Stefan"                # resolved to voice_id at runtime (name-match)
  target_duration_s: 90           # whole-video budget — "length is part of the prompt"; Σ scene budgets should fit this
  width: 1920
  height: 1080
  fps: 30
  settle_default_ms: 800          # breathing room around every action

scenes:
  - id: intro-dashboard
    title: "Landing on the dashboard"
    intent: "Establish where we are — the dashboard the user sees right after login"
    narration_gist: "no setup, straight into the product"
    budget_s: 25
    reference_screenshot: scenes/intro-dashboard.png   # pass-1 exploration shot
    steps:
      - { type: navigate, url: "https://console.acme.dev" }
      - { type: assert, selector: "role=heading[name='Overview']" }

  - id: create-project
    title: "Create the first project"
    intent: "Show the primary action — how fast a user gets to value"
    narration_gist: "one click and a name, that's the entire ceremony"
    budget_s: 30
    reference_screenshot: scenes/create-project.png
    hold_ms: 1500                 # narration needs extra dwell here
    steps:
      - { type: click, selector: "role=button[name='New project']" }
      - { type: type, selector: "role=textbox[name='Project name']", text: "demo-poc" }
      - { type: click, selector: "role=button[name='Create']" }
      - { type: assert, selector: "role=heading[name*='demo-poc']" }

  - id: first-insight
    title: "The first real insight"
    intent: "Payoff — the moment the product proves its value"
    narration_gist: "from zero to a real answer in under a minute"
    budget_s: 35
    reference_screenshot: scenes/first-insight.png
    steps:
      - { type: click, selector: "role=tab[name='Insights']" }
      - { type: wait, ms: 1200 }              # result needs a beat to render — keep short
      - { type: assert, selector: "role=img[name='insight-chart']" }
    hold_ms: 2000
