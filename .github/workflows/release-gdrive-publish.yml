name: release gdrive-publish

# Publishes the npm package from the extensions/gdrive-publish subdirectory.
# Tag convention: gdrive-publish-v<version> (the monorepo hosts multiple tools,
# so each carries its own tag prefix). The version in extensions/gdrive-publish/
# package.json and commands.ts VERSION must match the tag - a test enforces
# the first half; this workflow checks the tag.
#
# Authentication uses npm Trusted Publishing (OIDC): no token secret. The
# trusted publisher must be registered on npmjs.com for this package
# (package -> Settings -> Trusted publishing) with:
#   repository: codingfragments/pi-extensions
#   workflow:   release-gdrive-publish.yml
#   environment: (none - do not set one here)
#
# Trusted publishing can only be registered after the package exists, so the
# very first version ships with a manual `npm publish` from a logged-in
# terminal, and tagged releases start with the next version.

on:
  push:
    tags:
      - "gdrive-publish-v*"

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC): lets the job prove its
  # identity to the npm registry without any stored token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install --ignore-scripts
      # Full offline suite must pass before anything is published.
      - run: npm test
      # Compile the dist/ artifact that the published tarball ships.
      - run: npm run build:gdrive-publish
      - name: Check tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./extensions/gdrive-publish/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#gdrive-publish-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm publish
        working-directory: extensions/gdrive-publish
